{% extends "base.html" %}

{% block page_title %}
    {{ page.title }}
    – {{ super() }}
{% endblock %}

{% block content %}
    <h1 class="font-mono">{{ page.title }}</h1>

    <p>
        Posted on {{ page.date | date(format="%-d %b %Y") }} –
        <a href="{{ get_url(path='@/posts/_index.md') }}">List of posts</a>
    </p>

    {{ page.content | safe }}
{% endblock content %}
